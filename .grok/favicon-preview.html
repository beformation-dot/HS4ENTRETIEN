<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; background: #111; }
    .row { display: flex; align-items: flex-end; gap: 16px; padding: 16px; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #aaa; font: 11px sans-serif; }
    img { image-rendering: pixelated; display: block; background: #3a261c; }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell"><img src="favicon-src.svg" width="16" height="16" alt="16" />16</div>
    <div class="cell"><img src="favicon-src.svg" width="32" height="32" alt="32" />32</div>
    <div class="cell"><img src="favicon-src.svg" width="64" height="64" alt="64" />64</div>
    <div class="cell"><img src="favicon-src.svg" width="128" height="128" alt="128" />128</div>
  </div>
</body>
</html>
